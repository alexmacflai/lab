<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d8d5cb">
  <title>Receipt Portrait</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage"><canvas id="portrait" width="840" height="1040" aria-label="A delayed camera print on a paper receipt"></canvas></main>
  <p id="status" role="status" class="sr-only">Loading paper…</p>
  <p id="subject-status" role="status" class="sr-only"></p>
  <p id="notice" class="notice" role="alert" hidden></p>
  <footer class="camera-bar">
    <div class="camera-actions">
      <button id="start" class="camera-button" disabled>Loading…</button>
      <div id="inline-options" class="inline-options" role="group" aria-label="Camera options"></div>
      <button id="open-settings" class="icon-button" aria-label="Camera options" aria-haspopup="dialog" aria-controls="settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>
      </button>
    </div>
  </footer>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="drawer-heading"><h1 id="settings-title">Camera options</h1><button id="close-settings" class="icon-button" aria-label="Close camera options"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div id="drawer-options">
    <button id="auto-frame" class="switch-row" role="switch" aria-checked="true"><span>Keep me in frame</span><span class="switch-track" aria-hidden="true"></span></button>
    <button id="subject-mask" class="switch-row" role="switch" aria-checked="false"><span>Remove background</span><span class="switch-track" aria-hidden="true"></span></button>
    <button id="back-camera" class="switch-row mobile-camera-option" role="switch" aria-checked="false"><span>Back camera</span><span class="switch-track" aria-hidden="true"></span></button>
    </div>
  </dialog>
  <script type="module" src="main.js"></script>
</body>
</html>
