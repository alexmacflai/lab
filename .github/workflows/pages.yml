name: Publish lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the lab
        uses: actions/checkout@v6
      - name: Generate the prototype index
        run: |
          python3 tools/update-index.py
          python3 tools/update-index.py --check
      - name: Prepare the site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R prototypes _site/prototypes
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
