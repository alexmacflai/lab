<title>Pen Pals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* Layout: DOS-style menu bar on top, integer-scaled 320x200 canvas centered, status/legend row below. Single dark CGA look, by choice. */
  :root {
    --bg: #000000;      /* CGA 0  black */
    --ink: #AAAAAA;     /* CGA 7  light grey */
    --dim: #555555;     /* CGA 8  dark grey */
    --hi: #FFFFFF;      /* CGA 15 white */
    --bar: #00AAAA;     /* CGA 3  cyan */
    --bar-ink: #000000;
    --font: "VT323", "Courier New", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 20px;
    line-height: 1;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
    -webkit-font-smoothing: none;
    font-smooth: never;
  }
  .app { height: 100%; display: flex; flex-direction: column; gap: 10px; }

  .menubar {
    display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: center;
    background: var(--bar); color: var(--bar-ink);
    padding: 3px 8px;
  }
  .menubar .name { color: var(--hi); background: var(--bar-ink); padding: 0 6px; letter-spacing: 1px; }
  .menubar .spacer { flex: 1; }
  .menubar button {
    font: inherit; color: inherit; background: none; border: 0; padding: 0 4px; cursor: pointer;
  }
  .menubar button:hover, .menubar button:focus-visible { background: var(--bar-ink); color: var(--bar); outline: none; }
  .menubar u { text-decoration: none; color: var(--hi); }
  .menubar button:hover u, .menubar button:focus-visible u { color: var(--hi); }

  .stage { flex: 1; min-height: 0; display: grid; place-items: center; }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 2px solid var(--dim);
    cursor: crosshair;
    touch-action: none;
  }

  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px 14px; }
  .bot {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center;
    font: inherit; text-align: left; color: var(--ink); background: none;
    border: 0; padding: 2px 4px; cursor: pointer;
  }
  .bot:focus-visible { outline: 1px dashed var(--hi); }
  .bot .sw { width: 12px; height: 12px; background: var(--c); grid-row: span 2; align-self: start; margin-top: 3px; }
  .bot .nm { color: var(--c); }
  .bot .st { color: var(--dim); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bot[aria-pressed="false"] .sw { background: none; outline: 1px solid var(--dim); outline-offset: -1px; }
  .bot[aria-pressed="false"] .nm { color: var(--dim); }
  .hint { color: var(--dim); font-size: 17px; }
</style>

<div class="app">
  <div class="menubar" role="toolbar" aria-label="Controls">
    <span class="name">PEN PALS</span>
    <button id="b-pause"><u>SPACE</u> <span id="pause-lbl">Pause</span></button>
    <button id="b-clear"><u>C</u> Clear</button>
    <button id="b-slower"><u>-</u></button><span id="speed">SPD 2</span><button id="b-faster"><u>+</u></button>
    <span class="spacer"></span>
    <span id="clock">320x200 4BPP</span>
  </div>

  <div class="stage" id="stage">
    <canvas id="c" width="320" height="200" aria-label="Shared drawing canvas. Drag to draw in white."></canvas>
  </div>

  <div class="legend" id="legend"></div>
  <div class="hint">Drag on the canvas to draw with them. Keys 1-5 or click a pen to bench it.</div>
</div>

<script>
(() => {
  const W = 320, H = 200;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;
  const img = ctx.createImageData(W, H);
  const buf = new Uint32Array(img.data.buffer);

  const hex = h => { const n = parseInt(h.slice(1), 16); return (0xFF << 24 | (n & 0xFF) << 16 | (n & 0xFF00) | (n >> 16 & 0xFF)) >>> 0; };
  const BLACK = hex('#000000'), WHITE = hex('#FFFFFF');
  buf.fill(BLACK);

  const rand = (a, b) => a + Math.random() * (b - a);
  const irand = (a, b) => Math.floor(rand(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const TAU = Math.PI * 2, DEG15 = Math.PI / 12;

  function plot(x, y, c) { if (x >= 0 && y >= 0 && x < W && y < H) buf[y * W + x] = c; }
  // Bresenham: hard 1px lines, every pixel fully on or off.
  function line(x0, y0, x1, y1, c) {
    let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      plot(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  const M = 10; // edge margin
  const nearEdge = (x, y, m = M) => x < m || y < m || x > W - 1 - m || y > H - 1 - m;
  const toCenter = (x, y) => Math.atan2(H / 2 + rand(-40, 40) - y, W / 2 + rand(-80, 80) - x);
  const turnToward = (a, t, k) => { let d = ((t - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * k; };

  // ---------- Pens ----------
  function makeBot(o) {
    return Object.assign({
      x: rand(40, W - 40), y: rand(30, H - 30), a: rand(0, TAU),
      pen: true, on: true, trail: [], status: '', speed: 1,
      color: hex(o.hex),
    }, o);
  }

  function advance(b, spd) {
    const px = Math.round(b.x), py = Math.round(b.y);
    b.x = Math.min(W - 1, Math.max(0, b.x + Math.cos(b.a) * spd));
    b.y = Math.min(H - 1, Math.max(0, b.y + Math.sin(b.a) * spd));
    ink(b, px, py);
  }
  function moveToward(b, tx, ty, spd) {
    const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
    const px = Math.round(b.x), py = Math.round(b.y);
    if (d <= spd) { b.x = tx; b.y = ty; }
    else { b.a = Math.atan2(dy, dx); b.x += dx / d * spd; b.y += dy / d * spd; }
    ink(b, px, py);
    return d <= spd;
  }
  function ink(b, px, py) {
    if (!b.pen) return;
    const nx = Math.round(b.x), ny = Math.round(b.y);
    line(px, py, nx, ny, b.color);
    b.trail.push({ x: b.x, y: b.y, a: b.a });
    if (b.trail.length > 900) b.trail.shift();
  }

  const bots = [
    makeBot({
      name: 'DOODLE', hex: '#FF55FF', turn: 0,
      blurb: 'never goes straight',
      step(b) {
        b.turn += rand(-0.09, 0.09);
        b.turn *= 0.94;
        b.a += b.turn + rand(-0.12, 0.12);
        if (nearEdge(b.x, b.y)) b.a = turnToward(b.a, toCenter(b.x, b.y), 0.25);
        advance(b, 1.1);
        b.status = Math.abs(b.turn) > 0.08 ? 'loop-de-loop' : 'scribbling';
      }
    }),
    makeBot({
      name: 'GRAFT', hex: '#55FF55', mode: 'pick', t: 0, tx: 0, ty: 0, src: null, turn: 0,
      blurb: 'branches off the others',
      step(b) {
        if (b.mode === 'pick') {
          const hosts = bots.filter(o => o !== b && o.on && o.trail.length > 30);
          if (!hosts.length) { b.a += rand(-0.2, 0.2); advance(b, 1); b.status = 'waiting for a host'; return; }
          b.src = pick(hosts);
          const p = b.src.trail[irand(0, b.src.trail.length - 1)];
          b.tx = p.x; b.ty = p.y; b.srcA = p.a;
          b.pen = false; b.mode = 'travel';
        }
        if (b.mode === 'travel') {
          b.status = 'hopping to ' + b.src.name;
          if (moveToward(b, b.tx, b.ty, 2.6)) {
            b.pen = true; b.mode = 'branch';
            b.a = b.srcA + (Math.random() < 0.5 ? 1 : -1) * rand(0.5, 1.3);
            b.t = irand(80, 220); b.turn = rand(-0.03, 0.03);
          }
          return;
        }
        // branch: a gentle twig growing off the host's line
        b.turn += rand(-0.01, 0.01); b.turn = Math.max(-0.05, Math.min(0.05, b.turn));
        b.a += b.turn;
        if (nearEdge(b.x, b.y, 4)) b.t = 0;
        advance(b, 1);
        b.status = 'branching off ' + b.src.name;
        if (--b.t <= 0) b.mode = 'pick';
      }
    }),
    makeBot({
      name: 'RULER', hex: '#55FFFF', t: 0,
      blurb: 'straight lines, 15° steps',
      step(b) {
        if (b.t <= 0 || nearEdge(b.x, b.y, 3)) {
          let base;
          if (nearEdge(b.x, b.y, 3)) base = toCenter(b.x, b.y);
          else base = b.a + pick([-1, 1]) * irand(2, 9) * DEG15;
          b.a = Math.round(base / DEG15) * DEG15;
          // nudge off the edge so we don't immediately re-trigger
          b.x += Math.cos(b.a) * 2; b.y += Math.sin(b.a) * 2;
          b.t = irand(25, 110);
        }
        b.t--;
        advance(b, 1.2);
        const deg = ((Math.round(b.a / DEG15) * 15) % 360 + 360) % 360;
        b.status = 'heading ' + String(deg).padStart(3, '0') + '°';
      }
    }),
    makeBot({
      name: 'COIL', hex: '#FFFF55', k: 0.2, dir: 1, mode: 'spin', tx: 0, ty: 0,
      blurb: 'spirals outward, then relocates',
      step(b) {
        if (b.mode === 'travel') {
          b.status = 'finding a spot';
          if (moveToward(b, b.tx, b.ty, 2.2)) {
            b.pen = true; b.mode = 'spin'; b.k = rand(0.16, 0.24); b.dir = pick([-1, 1]);
          }
          return;
        }
        b.a += b.k * b.dir;
        b.k *= 0.9965;
        advance(b, 1);
        b.status = 'winding r=' + Math.round(1 / b.k);
        if (b.k < 0.03 || nearEdge(b.x, b.y, 2)) {
          b.pen = false; b.mode = 'travel';
          b.tx = rand(30, W - 30); b.ty = rand(25, H - 25);
        }
      }
    }),
    makeBot({
      name: 'HATCH', hex: '#FF5555', path: [],
      blurb: 'shades little patches',
      step(b) {
        if (!b.path.length) {
          const cx = rand(25, W - 25), cy = rand(20, H - 20);
          const ang = irand(0, 7) * Math.PI / 4;
          const L = rand(8, 26), gap = pick([2, 3, 3, 4]), n = irand(5, 14);
          const ux = Math.cos(ang), uy = Math.sin(ang), vx = -uy, vy = ux;
          for (let i = 0; i < n; i++) {
            const off = (i - n / 2) * gap, s = i % 2 ? 1 : -1;
            for (const e of [-s, s]) b.path.push({ x: cx + ux * L / 2 * e + vx * off, y: cy + uy * L / 2 * e + vy * off, pen: true });
          }
          b.path[0].pen = false; // travel to the first corner with the pen lifted
        }
        const wp = b.path[0];
        b.pen = wp.pen;
        b.status = wp.pen ? 'hatching (' + Math.ceil(b.path.length / 2) + ' left)' : 'moving to new patch';
        if (moveToward(b, Math.min(W - 1, Math.max(0, wp.x)), Math.min(H - 1, Math.max(0, wp.y)), wp.pen ? 1.3 : 2.4)) b.path.shift();
      }
    }),
  ];

  // ---------- Pointer sprite (shared by every pen; fill takes the pen's colour) ----------
  const SPRITE = [
    'K.....',
    'KK....',
    'KcK...',
    'KccK..',
    'KcccK.',
    'KccccK',
    'KccKKK',
    'KKcK..',
    'K.KcK.',
    '..KcK.',
    '...K..',
  ];
  function drawSprite(x, y, color) {
    for (let r = 0; r < SPRITE.length; r++)
      for (let c = 0; c < SPRITE[r].length; c++) {
        const ch = SPRITE[r][c];
        if (ch === '.') continue;
        ctx.fillStyle = ch === 'K' ? '#000000' : color;
        ctx.fillRect(x + c, y + r, 1, 1);
      }
  }

  // ---------- User drawing ----------
  let drawing = false, lx = 0, ly = 0;
  const toPix = e => {
    const r = cv.getBoundingClientRect();
    return [Math.floor((e.clientX - r.left) / r.width * W), Math.floor((e.clientY - r.top) / r.height * H)];
  };
  cv.addEventListener('pointerdown', e => { drawing = true; cv.setPointerCapture(e.pointerId); [lx, ly] = toPix(e); plot(lx, ly, WHITE); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = toPix(e); line(lx, ly, x, y, WHITE); lx = x; ly = y; });
  const stop = () => { drawing = false; };
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);

  // ---------- Legend ----------
  const legend = document.getElementById('legend');
  bots.forEach((b, i) => {
    const el = document.createElement('button');
    el.className = 'bot'; el.id = 'bot-' + b.name.toLowerCase();
    el.style.setProperty('--c', b.hex);
    el.setAttribute('aria-pressed', 'true');
    el.title = b.blurb;
    el.innerHTML = `<span class="sw"></span><span class="nm">${i + 1} ${b.name}</span><span class="st"></span>`;
    el.addEventListener('click', () => toggle(i));
    legend.appendChild(el);
    b.el = el; b.stEl = el.querySelector('.st');
  });
  function toggle(i) {
    const b = bots[i]; b.on = !b.on;
    b.el.setAttribute('aria-pressed', String(b.on));
  }

  // ---------- Controls ----------
  let paused = false, speed = 2;
  const speedEl = document.getElementById('speed'), pauseLbl = document.getElementById('pause-lbl');
  const setSpeed = s => { speed = Math.max(1, Math.min(9, s)); speedEl.textContent = 'SPD ' + speed; };
  const togglePause = () => { paused = !paused; pauseLbl.textContent = paused ? 'Resume' : 'Pause'; };
  const clear = () => { buf.fill(BLACK); bots.forEach(b => (b.trail.length = 0)); };
  document.getElementById('b-pause').onclick = togglePause;
  document.getElementById('b-clear').onclick = clear;
  document.getElementById('b-slower').onclick = () => setSpeed(speed - 1);
  document.getElementById('b-faster').onclick = () => setSpeed(speed + 1);
  addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'c' || e.key === 'C') clear();
    else if (e.key === '-' || e.key === '_') setSpeed(speed - 1);
    else if (e.key === '+' || e.key === '=') setSpeed(speed + 1);
    else if (e.key >= '1' && e.key <= '5') toggle(+e.key - 1);
  });
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) setSpeed(1);

  // ---------- Integer scaling ----------
  const stage = document.getElementById('stage');
  function fit() {
    const r = stage.getBoundingClientRect();
    const s = Math.max(1, Math.floor(Math.min((r.width - 4) / W, (r.height - 4) / H)));
    cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  }
  new ResizeObserver(fit).observe(stage); fit();

  // ---------- Loop ----------
  const clock = document.getElementById('clock');
  let frames = 0;
  function tick() {
    if (!paused) for (let s = 0; s < speed; s++) for (const b of bots) if (b.on) b.step(b);
    ctx.putImageData(img, 0, 0);
    for (const b of bots) if (b.on) drawSprite(Math.round(b.x), Math.round(b.y), b.hex);
    if (frames++ % 6 === 0) {
      for (const b of bots) b.stEl.textContent = b.on ? b.status : 'benched';
      clock.textContent = paused ? 'PAUSED' : new Date().toTimeString().slice(0, 8);
    }
    requestAnimationFrame(tick);
  }
  // Open with something already on the page.
  for (let s = 0; s < 500; s++) for (const b of bots) b.step(b);
  tick();
})();
</script>
